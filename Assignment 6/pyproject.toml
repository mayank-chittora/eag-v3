[project]
name = "eag-v3-assignment-6"
version = "0.1.0"
description = "Multi-role cognitive agent — EAG V3 Session 6"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.0",
    "mcp>=1.0.0",
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "tavily-python>=0.3.0",
    "ddgs>=7.0.0",
    "crawl4ai>=0.4.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
