<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reading Assistant — Settings</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div class="container">
    <header class="header">
      <div class="logo">
        <svg width="24" height="24" viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
          <rect width="24" height="24" rx="6" fill="#1A56DB"/>
          <path d="M7 8h10M7 12h10M7 16h6" stroke="#fff" stroke-width="1.8" stroke-linecap="round"/>
        </svg>
        <span class="logo-text">Reading Assistant</span>
      </div>
      <p class="tagline">AI-powered explanations for any text you select</p>
    </header>

    <main class="main">
      <div class="field-group">
        <label class="label" for="api-key-input">
          Gemini API Key
          <a class="label-link" href="https://aistudio.google.com/apikey" target="_blank" rel="noopener">
            Get a key →
          </a>
        </label>
        <div class="input-wrapper">
          <input
            type="password"
            id="api-key-input"
            class="input"
            placeholder="AIza..."
            autocomplete="off"
            spellcheck="false"
          />
          <button type="button" id="toggle-visibility" class="toggle-btn" aria-label="Toggle key visibility">
            <svg id="eye-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
          </button>
        </div>
      </div>

      <div class="field-group">
        <label class="label" for="model-select">Gemini Model</label>
        <select id="model-select" class="select">
          <optgroup label="Stable">
            <option value="gemini-2.5-flash">Gemini 2.5 Flash (recommended)</option>
            <option value="gemini-2.5-flash-lite">Gemini 2.5 Flash Lite (fastest)</option>
            <option value="gemini-2.5-pro">Gemini 2.5 Pro (most capable)</option>
          </optgroup>
          <optgroup label="Preview">
            <option value="gemini-3.1-pro-preview">Gemini 3.1 Pro Preview</option>
            <option value="gemini-3-flash-preview">Gemini 3 Flash Preview</option>
            <option value="gemini-3.1-flash-lite-preview">Gemini 3.1 Flash Lite Preview</option>
          </optgroup>
        </select>
      </div>

      <button type="button" id="save-btn" class="save-btn">Save Settings</button>

      <div id="status-msg" class="status" role="status" aria-live="polite"></div>
    </main>

    <footer class="footer">
      <p>How to use: select any text on a webpage → click <strong>Know More</strong></p>
    </footer>
  </div>

  <script src="popup.js"></script>
</body>
</html>
